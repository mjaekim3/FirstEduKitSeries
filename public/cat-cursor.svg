<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .tail { transform-origin: 73px 70px; animation: tail-wag 1.6s ease-in-out infinite alternate; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s ease-in-out infinite; }
    @keyframes tail-wag { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.12); } }
    @media (prefers-reduced-motion: reduce) { .tail, .eye { animation: none; } }
  </style>

